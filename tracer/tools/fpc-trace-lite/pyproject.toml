[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpc-trace-lite"
version = "1.0.0"
description = "Flang Pipeline Construct Tracer — Python trace engine (Track A)"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "anthropic>=0.25", "python-multipart"]

[project.scripts]
fpc-trace-lite = "fpc_trace_lite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fpc_trace_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
